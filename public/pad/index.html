<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e16">
<title>Racing Wars — Controle</title>
<link rel="stylesheet" href="/pad/pad.css">
</head>
<body>
<div id="join" class="view">
  <div class="logo">RACING<br>WARS</div>
  <p>Digite o código que aparece na tela</p>
  <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD">
  <input id="name" maxlength="14" autocomplete="off" placeholder="Seu nome (opcional)">
  <button id="go">ENTRAR</button>
  <div id="err"></div>
</div>

<div id="pad" class="view" hidden>
  <div id="hdr"><span id="me"></span><span id="who"></span><span id="pts"></span><span id="ping">● servidor</span><button id="editp" aria-label="Editar perfil">✏️ Perfil</button><button id="fs" aria-label="Tela cheia">⛶</button></div>
  <div id="drive" hidden>
    <div id="act"><div id="ico"></div><div id="itl"></div><div class="hint" id="firehint">AÇÃO</div></div>
    <div id="arrows">
      <div class="arrow" id="btnL">◀</div>
      <div class="arrow" id="btnR">▶</div>
    </div>
    <div id="revhint">as duas setas juntas = RÉ</div>
  </div>
  <div id="menu" hidden>
    <div id="mtitle"></div>
    <div id="minfo" hidden><img id="mthumb" alt=""><div class="mtx"><b id="mname"></b><small id="msub"></small><small id="mextra"></small></div></div>
    <div id="mctl">
      <div class="dpad">
        <button data-k="up" class="u" aria-label="Cima">▲</button>
        <button data-k="left" class="l" aria-label="Esquerda">◀</button>
        <button data-k="down" class="d" aria-label="Baixo">▼</button>
        <button data-k="right" class="r" aria-label="Direita">▶</button>
      </div>
      <div class="acts">
        <button data-k="ok" class="ok" id="mok">OK</button>
        <button data-k="back" class="back">VOLTAR</button>
      </div>
    </div>
  </div>
  <div id="msg" hidden></div>
  <div id="skull" hidden>💀</div>
  <div id="prof" hidden>
    <div class="prow"><span id="pav" class="pav"></span><input id="pname" maxlength="14" autocomplete="off" placeholder="Seu nome"></div>
    <div id="emojis"></div>
    <div class="prow"><label class="pbtn">📷 Foto<input id="pfile" type="file" accept="image/*" capture="user" hidden></label><button class="pbtn" id="pclear">Sem foto</button><button class="pbtn ok" id="pdone">PRONTO</button></div>
  </div>
</div>
<div id="rotate"><div class="ph">📱</div>Gire o celular<br>para o modo paisagem</div>
<script src="/pad/pad.js" type="module"></script>
</body>
</html>
